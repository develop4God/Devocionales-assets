name: Update habitus image index

on:
  push:
    branches: [main]
    paths:
      - 'images/habitus/**'
      - '.github/workflows/habitus-index.yml'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate images/habitus/index.json
        run: |
          python3 - <<'EOF'
          import json
          import os

          habitus_dir = 'images/habitus'
          files = sorted(
              f for f in os.listdir(habitus_dir)
              if os.path.isfile(os.path.join(habitus_dir, f)) and f != 'index.json'
          )
          with open(os.path.join(habitus_dir, 'index.json'), 'w', encoding='utf-8') as fh:
              json.dump({'files': files}, fh, indent=2, ensure_ascii=False)
              fh.write('\n')
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet -- images/habitus/index.json; then
            echo "No changes to index.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/habitus/index.json
          git commit -m "chore: regenerate images/habitus/index.json [skip ci]"
          git push
