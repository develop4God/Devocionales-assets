name: Update habitus image index

on:
  push:
    branches: [main]
    paths:
      - 'images/habitus/**'
      - '.github/scripts/generate_habitus_index.py'
      - '.github/workflows/habitus-index.yml'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install libavif (avifdec, used for orientation validation)
        run: sudo apt-get update && sudo apt-get install -y libavif-bin

      - name: Regenerate and validate images/habitus/index.json
        run: python3 .github/scripts/generate_habitus_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- images/habitus/index.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/habitus/index.json
          git commit -m "chore: regenerate images/habitus/index.json [skip ci]"
          git push
