name: Update devotionals image index

on:
  push:
    branches: [main]
    paths:
      - 'images/devotionals/**'
      - '.github/scripts/generate_devotionals_index.py'
      - '.github/workflows/devotionals-index.yml'
  pull_request:
    paths:
      - 'images/devotionals/**'
      - '.github/scripts/generate_devotionals_index.py'
      - '.github/workflows/devotionals-index.yml'
  workflow_dispatch: {}

jobs:
  update-index:
    runs-on: ubuntu-latest
    # Only needed for the push-to-main path's commit-back step below;
    # pull_request runs don't push, so this permission is unused there.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install libavif (avifdec, used for orientation validation)
        run: sudo apt-get update && sudo apt-get install -y libavif-bin

      - name: Regenerate and validate images/devotionals/index.json
        run: python3 .github/scripts/generate_devotionals_index.py

      # PRs only need the validation above (orientation gate, reverse
      # validation) to catch a bad image before merge — they can't safely
      # push a commit back to an arbitrary PR branch the way a same-repo
      # push to main can. push and manual workflow_dispatch runs commit
      # the regenerated index.json; pull_request runs validate only.
      - name: Commit if changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- images/devotionals/index.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/devotionals/index.json
          git commit -m "chore: regenerate images/devotionals/index.json [skip ci]"
          git push
